<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企會財私人財富管理終端｜第 3 課：個人理財策劃及投資</title>
  <style>
    :root {
      --bg-dark: #071318;
      --card-bg: #ffffff;
      --soft-bg: #f8fafc;
      --teal-dark: #0f3d3e;
      --teal: #0d9488;
      --teal-light: #ccfbf1;
      --gold: #d97706;
      --gold-light: #fef3c7;
      --blue: #2563eb;
      --blue-light: #dbeafe;
      --emerald: #059669;
      --emerald-light: #d1fae5;
      --rose: #e11d48;
      --rose-light: #ffe4e6;
      --text: #0f172a;
      --muted: #64748b;
      --scale: 1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "PingFang HK", "Microsoft JhengHei", "Noto Sans TC", sans-serif; user-select: none; }
    body {
      background: radial-gradient(circle at top right, #134e4a, #071318 70%);
      color: var(--text);
      padding: 12px;
      font-size: calc(15.5px * var(--scale));
      line-height: 1.55;
      min-height: 100vh;
    }

    @keyframes fadeSlide { 0% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: translateY(0); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
    .fade-in { animation: fadeSlide 0.25s ease-out; }
    .shake { animation: shake 0.3s ease-in-out; }

    .app-wrap { max-width: 1140px; margin: 0 auto; }

    /* 頂部私人財富管理 Header */
    .wealth-header {
      background: linear-gradient(135deg, #064e3b 0%, #0f766e 50%, #1e3a8a 100%);
      border-radius: 22px;
      padding: 16px 22px;
      color: #fff;
      margin-bottom: 14px;
      box-shadow: 0 14px 32px rgba(0,0,0,0.5);
      border: 1px solid rgba(52, 211, 153, 0.35);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .wh-left { display: flex; align-items: center; gap: 14px; }
    .wh-badge {
      background: linear-gradient(135deg, #fbbf24, #d97706);
      color: #0f172a;
      padding: 9px 13px;
      border-radius: 14px;
      font-weight: 900;
      font-size: calc(12.5px * var(--scale));
      text-align: center;
      line-height: 1.25;
      box-shadow: 0 6px 14px rgba(217, 119, 6, 0.35);
    }
    .wh-title { font-size: calc(20px * var(--scale)); font-weight: 900; }
    .wh-sub { font-size: calc(12.5px * var(--scale)); color: #a7f3d0; font-weight: 700; }

    /* 雙軌難度切換器與狀態列 */
    .wh-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .diff-switcher {
      display: inline-flex;
      background: rgba(6, 19, 24, 0.8);
      border: 2px solid rgba(251, 191, 36, 0.65);
      border-radius: 30px;
      padding: 3px;
      gap: 4px;
    }
    .diff-btn {
      border: none;
      padding: 5px 12px;
      border-radius: 24px;
      font-weight: 900;
      font-size: calc(12.5px * var(--scale));
      cursor: pointer;
      background: transparent;
      color: #cbd5e1;
      transition: all 0.2s;
    }
    .diff-btn.active-basic {
      background: #10b981;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.5);
    }
    .diff-btn.active-challenge {
      background: #f59e0b;
      color: #0f172a;
      box-shadow: 0 2px 8px rgba(245, 158, 11, 0.5);
    }

    .stat-pill {
      background: rgba(6, 19, 24, 0.7);
      border: 1px solid rgba(52, 211, 153, 0.45);
      padding: 6px 12px;
      border-radius: 30px;
      font-weight: 900;
      font-size: calc(13px * var(--scale));
      color: #6ee7b7;
    }
    .ctrl-btn {
      background: #fbbf24;
      color: #0f172a;
      border: none;
      padding: 7px 13px;
      border-radius: 30px;
      font-weight: 900;
      font-size: calc(12.5px * var(--scale));
      cursor: pointer;
      transition: transform 0.15s;
    }
    .ctrl-btn:hover { transform: scale(1.05); background: #fcd34d; }

    /* 頂部常駐雙引擎沙盒：強積金計算機 ＆ 金融產品風險回報光譜 */
    .sandbox-panel {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #fff;
      border-radius: 18px;
      padding: 16px 22px;
      margin-bottom: 14px;
      border: 2px solid #2dd4bf;
      box-shadow: 0 10px 25px rgba(0,0,0,0.35);
    }
    .sb-top { display: flex; justify-content: space-between; align-items: center; cursor: pointer; flex-wrap: wrap; gap: 10px; }
    .sb-title { font-size: calc(15.5px * var(--scale)); font-weight: 900; color: #5eead4; display: flex; align-items: center; gap: 8px; }
    .sb-toggle { background: rgba(45, 212, 191, 0.2); color: #99f6e4; border: 1px solid #2dd4bf; padding: 4px 12px; border-radius: 20px; font-size: calc(12.5px * var(--scale)); font-weight: 900; cursor: pointer; }

    .sb-body { margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.15); }
    .sb-switch-bar { display: flex; gap: 8px; margin-bottom: 12px; }
    .sbs-btn { flex: 1; padding: 8px 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: #cbd5e1; font-weight: 900; font-size: calc(13.5px * var(--scale)); cursor: pointer; }
    .sbs-btn.active { background: #0d9488; color: #fff; border-color: #99f6e4; }

    .mpf-sim-grid { display: grid; grid-template-columns: 1fr 1.15fr; gap: 14px; align-items: center; }
    @media (max-width: 780px) { .mpf-sim-grid { grid-template-columns: 1fr; } }
    .mpf-slider-box { background: rgba(255,255,255,0.05); padding: 14px; border-radius: 12px; }
    .mpf-res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .mpf-kpi { background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255,255,255,0.18); border-radius: 12px; padding: 12px; text-align: center; }
    .mk-label { font-size: calc(12px * var(--scale)); color: #94a3b8; font-weight: 800; }
    .mk-val { font-size: calc(20px * var(--scale)); font-weight: 900; color: #fbbf24; margin: 3px 0; }
    .mk-sub { font-size: calc(11.5px * var(--scale)); color: #6ee7b7; font-weight: 700; }

    .spectrum-bar { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 12px; }
    @media (max-width: 820px) { .spectrum-bar { grid-template-columns: repeat(3, 1fr); } }
    .spec-btn {
      padding: 9px 6px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.22);
      background: rgba(255,255,255,0.06); color: #e2e8f0; font-weight: 900; font-size: calc(12.5px * var(--scale));
      cursor: pointer; text-align: center; transition: all 0.15s;
    }
    .spec-btn.active { background: #f59e0b; color: #0f172a; border-color: #fde047; transform: translateY(-2px); }
    .spec-info-card { background: rgba(15, 23, 42, 0.85); border: 1px solid #fbbf24; border-radius: 12px; padding: 12px 16px; font-size: calc(13.5px * var(--scale)); font-weight: 700; line-height: 1.55; }

    /* 四大實戰工作區導航 */
    .zone-nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
    @media (max-width: 780px) { .zone-nav { grid-template-columns: repeat(2, 1fr); } }
    .z-tab {
      background: #0f1f26; border: 2px solid #1e3a4c; border-radius: 14px; padding: 12px 10px;
      color: #94a3b8; cursor: pointer; text-align: center; transition: all 0.2s;
    }
    .z-tab:hover { border-color: #34d399; color: #fff; transform: translateY(-2px); }
    .z-tab.active {
      background: linear-gradient(135deg, #059669, #0d9488);
      border-color: #6ee7b7; color: #fff; box-shadow: 0 6px 18px rgba(5, 150, 105, 0.45);
    }
    .zt-icon { font-size: calc(23px * var(--scale)); display: block; margin-bottom: 3px; }
    .zt-title { font-size: calc(14.5px * var(--scale)); font-weight: 900; display: block; }
    .zt-sub { font-size: calc(11.5px * var(--scale)); opacity: 0.9; }

    /* 主舞台 */
    .main-stage {
      background: var(--card-bg);
      border-radius: 22px;
      padding: 24px;
      min-height: 540px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.45);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 2px solid #cbd5e1;
    }

    .stage-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 2px solid #e2e8f0; }
    .sh-title { font-size: calc(18px * var(--scale)); font-weight: 900; color: #064e3b; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .mode-pill-indicator { font-size: calc(12px * var(--scale)); padding: 3px 10px; border-radius: 20px; font-weight: 900; }
    .mp-basic { background: #d1fae5; color: #065f46; border: 1px solid #10b981; }
    .mp-challenge { background: #fef3c7; color: #92400e; border: 1px solid #f59e0b; }

    .dots-bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .dot-btn {
      width: calc(34px * var(--scale)); height: calc(34px * var(--scale));
      border-radius: 10px; border: 2px solid #cbd5e1; background: #fff;
      font-weight: 900; font-size: calc(13.5px * var(--scale)); cursor: pointer; color: var(--muted);
    }
    .dot-btn.active { background: var(--emerald); color: #fff; border-color: var(--emerald); }
    .dot-btn.done { background: var(--emerald-light); color: #064e3b; border-color: var(--emerald); }

    /* 啟發式導學引導卡（只在基礎導學模式顯示） */
    .scaffold-banner {
      background: linear-gradient(135deg, #ecfdf5, #d1fae5);
      border: 2px solid #34d399;
      border-left: 7px solid var(--emerald);
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 14px;
      color: #064e3b;
      font-size: calc(14px * var(--scale));
      font-weight: 800;
      line-height: 1.55;
    }
    .scaffold-tag {
      display: inline-block;
      background: var(--emerald);
      color: #fff;
      font-size: calc(11.5px * var(--scale));
      font-weight: 900;
      padding: 2px 9px;
      border-radius: 20px;
      margin-right: 6px;
      margin-bottom: 3px;
    }

    /* 案例情境卡片與資料表 */
    .case-card {
      background: linear-gradient(135deg, #f0fdfa, #ccfbf1);
      border: 2px solid #5eead4;
      border-left: 7px solid var(--teal);
      border-radius: 16px;
      padding: 16px 20px;
      margin-bottom: 16px;
    }
    .cc-tag { font-size: calc(12px * var(--scale)); font-weight: 900; color: #0f766e; margin-bottom: 4px; display: block; }
    .cc-desc { font-size: calc(15.5px * var(--scale)); font-weight: 900; color: #134e4a; line-height: 1.55; }

    .mini-table-wrap { overflow-x: auto; margin-bottom: 16px; }
    .info-table { width: 100%; border-collapse: collapse; font-size: calc(13.5px * var(--scale)); font-weight: 800; background: #fff; border-radius: 12px; overflow: hidden; border: 2px solid #cbd5e1; }
    .info-table th { background: #0f172a; color: #fff; padding: 8px 12px; text-align: left; }
    .info-table td { padding: 8px 12px; border-bottom: 1px solid #e2e8f0; color: #0f172a; }

    /* 三步對稱決策卡 */
    .steps-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
    @media (max-width: 820px) { .steps-grid { grid-template-columns: 1fr; } }
    .step-col {
      background: var(--soft-bg); border: 2px solid #cbd5e1; border-radius: 14px; padding: 14px;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .step-q { font-size: calc(13.5px * var(--scale)); font-weight: 900; color: #064e3b; margin-bottom: 10px; min-height: 42px; }
    .step-opts { display: flex; flex-direction: column; gap: 7px; }
    .step-btn {
      width: 100%; padding: 10px 12px; border-radius: 9px; border: 2px solid #cbd5e1;
      background: #fff; font-weight: 800; font-size: calc(13.5px * var(--scale)); color: var(--text);
      cursor: pointer; text-align: left; transition: all 0.15s; line-height: 1.45;
    }
    .step-btn:hover { border-color: var(--teal); background: #f0fdfa; }
    .step-btn.picked { background: var(--emerald-light); border-color: var(--emerald); color: #064e3b; box-shadow: inset 0 0 0 1px var(--emerald); }
    .step-btn.picked-ok { background: var(--emerald-light); border-color: var(--emerald); color: #064e3b; }
    .step-btn.picked-err { background: var(--rose-light); border-color: var(--rose); color: #881337; }

    /* 模組 4：紅筆捉錯 ＆ 選擇題消去雙擂台 */
    .sub-mode-bar { display: flex; gap: 8px; margin-bottom: 14px; }
    .sub-mode-btn { flex: 1; padding: 10px; border-radius: 10px; border: 2px solid #cbd5e1; background: #f8fafc; font-weight: 900; font-size: calc(14px * var(--scale)); cursor: pointer; color: var(--muted); }
    .sub-mode-btn.active { background: #064e3b; color: #fff; border-color: #064e3b; }
    .paper-sheet { background: #fefce8; border: 2px solid #fde047; border-radius: 16px; padding: 18px; margin-bottom: 14px; }
    .sentence-chips-wrap { display: flex; flex-direction: column; gap: 10px; }
    .sentence-chip { padding: 14px 16px; border-radius: 12px; border: 2px solid #cbd5e1; background: #fff; font-size: calc(15px * var(--scale)); font-weight: 800; color: var(--text); cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; line-height: 1.5; }
    .sentence-chip:hover { border-color: var(--rose); background: #fff1f2; }
    .sentence-chip.flaw-found { border-color: var(--rose); background: #ffe4e6; color: #9f1239; text-decoration: line-through; }
    .sentence-chip.good-clicked { border-color: var(--emerald); background: #dcfce7; color: #14532d; }

    .elim-stmt-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: #f8fafc; border: 2px solid #cbd5e1; border-radius: 12px; padding: 12px 16px; margin-bottom: 10px; flex-wrap: wrap; }
    .elim-stmt-text { font-size: calc(15px * var(--scale)); font-weight: 800; flex: 1; min-width: 240px; }
    .elim-stmt-hint { display: block; font-size: calc(12.5px * var(--scale)); color: #047857; font-weight: 800; margin-top: 4px; }
    .elim-toggles { display: flex; gap: 6px; }
    .elim-btn { padding: 6px 12px; border-radius: 8px; border: 2px solid #cbd5e1; background: #fff; font-weight: 900; font-size: calc(13.5px * var(--scale)); cursor: pointer; }
    .elim-btn.t-true { background: var(--emerald); color: #fff; border-color: var(--emerald); }
    .elim-btn.t-false { background: var(--rose); color: #fff; border-color: var(--rose); }
    .mc-options-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 14px; }
    @media (max-width: 600px) { .mc-options-row { grid-template-columns: 1fr; } }
    .mc-card-btn { padding: 14px 18px; border-radius: 12px; border: 2px solid #94a3b8; background: #fff; font-size: calc(16px * var(--scale)); font-weight: 900; text-align: left; cursor: pointer; transition: all 0.2s; }
    .mc-card-btn:hover { border-color: var(--emerald); background: #ecfdf5; }
    .mc-card-btn.eliminated { opacity: 0.28; text-decoration: line-through; background: #e2e8f0; border-color: #cbd5e1; }

    .helper-btn { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--emerald); background: var(--emerald-light); color: #064e3b; font-weight: 900; font-size: calc(12.5px * var(--scale)); cursor: pointer; }
    .helper-btn:hover { background: var(--emerald); color: #fff; }

    .feedback-box { margin-top: 12px; padding: 16px 18px; border-radius: 14px; font-size: calc(14.5px * var(--scale)); font-weight: 700; display: none; line-height: 1.65; }
    .fb-ok { background: var(--emerald-light); border: 2px solid var(--emerald); color: #064e3b; }
    .fb-err { background: var(--rose-light); border: 2px solid var(--rose); color: #881337; }

    .footer-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; padding-top: 12px; border-top: 2px solid #e2e8f0; }
    .f-nav-btn { padding: 10px 20px; border-radius: 10px; border: 2px solid #cbd5e1; background: #fff; font-weight: 900; font-size: calc(14px * var(--scale)); cursor: pointer; color: #064e3b; }
    .f-nav-btn:hover { background: var(--emerald-light); border-color: var(--emerald); }
    .f-primary { background: linear-gradient(135deg, #059669, #0d9488); color: #fff; border: none; }
    .f-primary:hover { opacity: 0.92; }
  </style>
</head>
<body>

<div class="app-wrap">
  <!-- 頂部私人財富管理 Header（預設開啟「🔥 實戰挑戰」） -->
  <header class="wealth-header">
    <div class="wh-left">
      <div class="wh-badge">📈 WEALTH & MPF<br>ADVISORY SUITE</div>
      <div>
        <div class="wh-title">基礎個人理財｜第 3 課：個人理財策劃及投資</div>
        <div class="wh-sub">風險與回報取捨、六大金融產品、生命週期理財策劃、投資者權責 ＆ 強積金（MPF）制度</div>
      </div>
    </div>
    <div class="wh-right">
      <div class="diff-switcher" title="切換學習模式：預設為實戰挑戰；如需思維引導與分步回饋可切換至基礎導學">
        <button class="diff-btn" id="btnBasicMode" onclick="setDifficulty(true)">🌱 基礎導學</button>
        <button class="diff-btn active-challenge" id="btnChallengeMode" onclick="setDifficulty(false)">🔥 實戰挑戰</button>
      </div>
      <div class="stat-pill" id="scoreBadge">💼 積分：0</div>
      <div class="stat-pill" id="comboBadge" style="color:#fde047; border-color:rgba(251,191,36,0.45);">🔥 連擊：0</div>
      <button class="ctrl-btn" onclick="reshuffleAll()">🔀 洗牌</button>
      <button class="ctrl-btn" onclick="toggleZoom()" id="zoomBtn">🔍 大字體：關</button>
    </div>
  </header>

  <!-- 頂部常駐雙引擎沙盒：強積金供款計算機 ＆ 金融產品風險回報光譜 -->
  <section class="sandbox-panel">
    <div class="sb-top" onclick="toggleSandbox()">
      <div class="sb-title">🎛️ 互動「強積金（MPF）供款計算機 ＆ 金融產品風險回報光譜」（點擊展開／收起）</div>
      <button class="sb-toggle" id="sbToggleBtn">收起工具箱 ▲</button>
    </div>
    <div class="sb-body" id="sbBody">
      <div class="sb-switch-bar">
        <button class="sbs-btn active" id="sbs0" onclick="switchSbTool(0)">🛡️ 工具一：強積金（MPF）每月強制性供款模擬器</button>
        <button class="sbs-btn" id="sbs1" onclick="switchSbTool(1)">📊 工具二：常見金融產品「風險回報光譜與清盤次序」</button>
      </div>
      <div id="sbInteractiveContent"></div>
    </div>
  </section>

  <!-- 四大工作區導航 -->
  <nav class="zone-nav">
    <button class="z-tab active" onclick="switchZone(0)" id="zTab0">
      <span class="zt-icon">📈</span>
      <span class="zt-title">風險回報與金融產品</span>
      <span class="zt-sub">存款、債券、優先股與普通股</span>
    </button>
    <button class="z-tab" onclick="switchZone(1)" id="zTab1">
      <span class="zt-icon">🌱</span>
      <span class="zt-title">生命週期理財策劃</span>
      <span class="zt-sub">六大人生階段與退休投資</span>
    </button>
    <button class="z-tab" onclick="switchZone(2)" id="zTab2">
      <span class="zt-icon">🛡️</span>
      <span class="zt-title">強積金與投資者權責</span>
      <span class="zt-sub">供款計算、轉移與提取條件</span>
    </button>
    <button class="z-tab" onclick="switchZone(3)" id="zTab3">
      <span class="zt-icon">🏆</span>
      <span class="zt-title">捉錯與消去雙擂台</span>
      <span class="zt-sub">紅筆批改 ＋ 組合選擇題</span>
    </button>
  </nav>

  <!-- 主舞台 -->
  <main class="main-stage" id="mainStage"></main>
</div>

<script>
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function fmt(num) {
    return Math.round(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  }

        { text: "強積金計劃成員可在年滿 65 歲時，或因「永久離開香港」、「年滿 60 歲並提早退休」等法定原因提取累算權益。", hint: "思考方向：回想提取強積金累算權益的正常年齡（65歲）及提早提取的法定原因。", isTrue: true, exp: "正確！永久離港及年滿 60 歲提早退休均符合提早提取累算權益的法定條件。" },
        { text: "所有香港僱員（包括家務僱員及工作一個月的暑期實習生）都必須參加強積金計劃；且所有自僱人士不論入息多少，都必須按每月有關入息的 5% 供款。", hint: "思考方向：家務僱員及受僱少於 60 日的暑期工是否獲豁免？月入低於 $7,100 或高於 $30,000 的自僱人士是否仍一律按 5% 供款？", isTrue: false, exp: "錯誤！家務僱員、自僱小販及受僱少於 60 日的非飲食／建造業僱員獲豁免；且月入少於 $7,100 的自僱人士無須供款（月入高於 $30,000 則上限 $1,500，並非 5%）！" }
      ]
    }
  ];

  const allComboDefs = [
    { order: 1, reqTrue: [1], reqFalse: [2, 3], text: "只有 (1)" },
    { order: 2, reqTrue: [2], reqFalse: [1, 3], text: "只有 (2)" },
    { order: 3, reqTrue: [3], reqFalse: [1, 2], text: "只有 (3)" },
    { order: 4, reqTrue: [1, 2], reqFalse: [3], text: "只有 (1) 及 (2)" },
    { order: 5, reqTrue: [1, 3], reqFalse: [2], text: "只有 (1) 及 (3)" },
    { order: 6, reqTrue: [2, 3], reqFalse: [1], text: "只有 (2) 及 (3)" },
    { order: 7, reqTrue: [1, 2, 3], reqFalse: [], text: "(1)、(2) 及 (3)" }
  ];

  function prepareDynamicMC(mcItem) {
    const shuffled = shuffle(mcItem.rawStmts);
    mcItem.stmts = shuffled.map((s, idx) => ({
      id: idx + 1,
      text: `(${idx + 1}) ${s.text}`,
      hint: s.hint,
      isTrue: s.isTrue,
      exp: s.exp
    }));
    const trueIds = mcItem.stmts.filter(s => s.isTrue).map(s => s.id);
    const correctCombo = allComboDefs.find(c =>
      c.reqTrue.length === trueIds.length && c.reqTrue.every(id => trueIds.includes(id))
    );
    const wrongPool = shuffle(allComboDefs.filter(c => c !== correctCombo)).slice(0, 3);
    const chosenCombos = [correctCombo, ...wrongPool].sort((a, b) => a.order - b.order);
    const letters = ["A", "B", "C", "D"];
    mcItem.options = chosenCombos.map((c, idx) => ({
      label: `${letters[idx]}. ${c.text}`,
      reqTrue: c.reqTrue,
      reqFalse: c.reqFalse
    }));
    mcItem.ansIdx = chosenCombos.indexOf(correctCombo);
  }

  // ==================== 狀態管理與渲染 ====================
  let curZone = 0;
  let subIdx = [0, 0, 0, 0];
  let stepPicks = [null, null, null];
  let elimState = { 1: null, 2: null, 3: null };
  let doneMap = {};
  let score = 0;
  let combo = 0;
  let isZoom = false;

  function randomizeAll() {
    [zone0Cases, zone1Cases, zone2Cases].forEach(list => {
      list.forEach(item => {
        item.opts1 = shuffle(item.opts1);
        item.opts2 = shuffle(item.opts2);
        item.opts3 = shuffle(item.opts3);
      });
    });
    redPenCases.forEach(c => { c.chips = shuffle(c.chips); });
    elimMCs = shuffle(elimMCs);
    elimMCs.forEach(m => prepareDynamicMC(m));
  }

  function reshuffleAll() {
    randomizeAll();
    stepPicks = [null, null, null];
    elimState = { 1: null, 2: null, 3: null };
    renderStage();
  }

  function toggleZoom() {
    isZoom = !isZoom;
    document.documentElement.style.setProperty('--scale', isZoom ? '1.16' : '1');
    document.getElementById("zoomBtn").innerText = isZoom ? "🔍 大字體：開" : "🔍 大字體：關";
  }

  function updateScoreDisplay() {
    document.getElementById("scoreBadge").innerText = `💼 積分：${score}`;
    document.getElementById("comboBadge").innerText = `🔥 連擊：${combo}`;
  }

  function addWealthScore(pts, key) {
    combo++;
    if (!doneMap[key]) {
      doneMap[key] = true;
      score += pts;
    }
    updateScoreDisplay();
  }

  function breakCombo() {
    combo = 0;
    updateScoreDisplay();
    const st = document.getElementById("mainStage");
    st.classList.remove("shake");
    void st.offsetWidth;
    st.classList.add("shake");
  }

  function switchZone(z) {
    curZone = z;
    for (let i = 0; i < 4; i++) {
      document.getElementById(`zTab${i}`).className = "z-tab" + (i === z ? " active" : "");
    }
    stepPicks = [null, null, null];
    elimState = { 1: null, 2: null, 3: null };
    renderStage();
  }

  function goSub(idx) {
    subIdx[curZone] = idx;
    stepPicks = [null, null, null];
    elimState = { 1: null, 2: null, 3: null };
    renderStage();
  }

  function getZoneList(z) {
    if (z === 0) return zone0Cases;
    if (z === 1) return zone1Cases;
    return zone2Cases;
  }

  function moveSub(delta, maxLen) {
    let next = subIdx[curZone] + delta;
    if (next >= 0 && next < maxLen) {
      goSub(next);
    } else if (delta > 0 && curZone < 3) {
      switchZone(curZone + 1);
    }
  }

  function buildDots(total, customPrefix) {
    const prefix = customPrefix || `${curZone}`;
    let html = "";
    for (let i = 0; i < total; i++) {
      const k = `${prefix}_${i}`;
      const cls = (i === subIdx[curZone]) ? "dot-btn active" : (doneMap[k] ? "dot-btn done" : "dot-btn");
      html += `<button class="${cls}" onclick="goSub(${i})">${i + 1}</button>`;
    }
    return html;
  }

  function renderStage() {
    const stage = document.getElementById("mainStage");
    stage.classList.remove("fade-in");
    void stage.offsetWidth;
    stage.classList.add("fade-in");

    if (curZone < 3) renderThreeStepZone(stage);
    else renderArenaZone(stage);
  }

  // ==================== 渲染工作區 1–3 ====================
  function renderThreeStepZone(stage) {
    const list = getZoneList(curZone);
    const idx = subIdx[curZone];
    const item = list[idx];

    const scaffoldHtml = isBasicMode ? `
      <div class="scaffold-banner">
        <span class="scaffold-tag">🌱 導學思維引導</span>
        ${item.guideHint}<br>
        ✨ <strong>導學支援</strong>：每步已縮小範圍至 2 個核心對比選項，點選後會<strong>即時回饋該步分析是否正確</strong>！
      </div>
    ` : '';

    const buildStepCol = (qTitle, optsArr, sIdx) => {
      const visibleOpts = isBasicMode ? optsArr.filter(o => o.basicKeep) : optsArr;
      const btns = visibleOpts.map((o) => {
        const origIdx = optsArr.indexOf(o);
        const isPicked = (stepPicks[sIdx] === origIdx);
        let btnCls = "step-btn";
        if (isPicked) {
          btnCls += isBasicMode ? (o.ok ? " picked-ok" : " picked-err") : " picked";
        }
        let statusSuffix = "";
        if (isBasicMode && isPicked) {
          statusSuffix = o.ok ? " ✅" : " ❌";
        }
        return `<button class="${btnCls}" onclick="pickStep(${sIdx}, ${origIdx})">👉 ${o.text}${statusSuffix}</button>`;
      }).join("");
      return `
        <div class="step-col">
          <div class="step-q">${qTitle}</div>
          <div class="step-opts">${btns}</div>
        </div>
      `;
    };

    stage.innerHTML = `
      <div>
        <div class="stage-header">
          <div class="sh-title">${item.title} ${getModeBadgeHtml()}</div>
          <div class="dots-bar">
            <button class="helper-btn" onclick="autoSolveThreeStep()">💡 示範三步滿分分析</button>
            ${buildDots(list.length)}
          </div>
        </div>

        ${scaffoldHtml}

        <div class="case-card">
          <span class="cc-tag">📌 ${item.tag}</span>
          <div class="cc-desc">${item.desc}</div>
        </div>

        ${item.tableHtml ? `<div class="mini-table-wrap">${item.tableHtml}</div>` : ''}

        <div class="steps-grid">
          ${buildStepCol(item.q1, item.opts1, 0)}
          ${buildStepCol(item.q2, item.opts2, 1)}
          ${buildStepCol(item.q3, item.opts3, 2)}
        </div>

        <div class="feedback-box" id="zoneFb"></div>
      </div>

      <div class="footer-bar">
        <button class="f-nav-btn" onclick="moveSub(-1, ${list.length})" ${idx === 0 ? 'style="visibility:hidden"' : ''}>← 上一個案</button>
        <button class="f-nav-btn f-primary" onclick="moveSub(1, ${list.length})">
          ${idx === list.length - 1 ? '進入下一理財工作區 →' : '下一個案 →'}
        </button>
      </div>
    `;

    if (stepPicks[0] !== null && stepPicks[1] !== null && stepPicks[2] !== null) {
      const fb = document.getElementById("zoneFb");
      fb.style.display = "block";
      const ok0 = item.opts1[stepPicks[0]].ok;
      const ok1 = item.opts2[stepPicks[1]].ok;
      const ok2 = item.opts3[stepPicks[2]].ok;

      if (ok0 && ok1 && ok2) {
        addWealthScore(25, `${curZone}_${idx}`);
        fb.className = "feedback-box fb-ok";
        fb.innerHTML = `🏆 <strong>三步財富管理分析全數正確！（積分 +25）</strong><br>${item.exp}`;
      } else {
        breakCombo();
        fb.className = "feedback-box fb-err";
        fb.innerHTML = `⚠️ <strong>部分步驟分析有誤：</strong> 第 1 步 [${ok0 ? '✓' : '✗'}] ｜ 第 2 步 [${ok1 ? '✓' : '✗'}] ｜ 第 3 步 [${ok2 ? '✓' : '✗'}]<br>${item.exp}`;
      }
    }
  }

  function pickStep(sIdx, oIdx) {
    stepPicks[sIdx] = oIdx;
    renderThreeStepZone(document.getElementById("mainStage"));
  }

  function autoSolveThreeStep() {
    const item = getZoneList(curZone)[subIdx[curZone]];
    stepPicks[0] = item.opts1.findIndex(o => o.ok);
    stepPicks[1] = item.opts2.findIndex(o => o.ok);
    stepPicks[2] = item.opts3.findIndex(o => o.ok);
    renderThreeStepZone(document.getElementById("mainStage"));
  }

  // ==================== 渲染工作區 4：捉錯與消去雙擂台 ====================
  function switchMod4Sub(s) {
    mod4Sub = s;
    subIdx[3] = 0;
    elimState = { 1: null, 2: null, 3: null };
    renderArenaZone(document.getElementById("mainStage"));
  }

  function renderArenaZone(stage) {
    const idx = subIdx[3];
    const topSwitch = `
      <div class="sub-mode-bar">
        <button class="sub-mode-btn ${mod4Sub === 0 ? 'active' : ''}" onclick="switchMod4Sub(0)">🖍️ 挑戰 A：紅筆捉錯（點擊答卷錯句）</button>
        <button class="sub-mode-btn ${mod4Sub === 1 ? 'active' : ''}" onclick="switchMod4Sub(1)">🏆 挑戰 B：組合選擇題消去法神器</button>
      </div>
    `;

    if (mod4Sub === 0) {
      const item = redPenCases[idx];
      const nums = ["①", "②", "③"];

      const scaffoldHtml = isBasicMode ? `
        <div class="scaffold-banner">
          <span class="scaffold-tag">🌱 導學審題切入點</span>
          ${item.guideHint}（已為你精簡句子字數，方便檢視邏輯）
        </div>
      ` : '';

      const chipsHtml = item.chips.map((ch, cIdx) => {
        const displayTxt = isBasicMode ? ch.easyText : ch.text;
        return `
          <div class="sentence-chip" id="rpChip_${cIdx}" onclick="checkRedPen(${cIdx})">
            <span>${nums[cIdx]} ${displayTxt}</span>
            <span style="font-size:calc(13px * var(--scale)); color:var(--rose); font-weight:900; white-space:nowrap;">🖍️ 點此捉錯</span>
          </div>
        `;
      }).join("");

      stage.innerHTML = `
        <div>
          ${topSwitch}
          <div class="stage-header">
            <span class="sh-title">🖍️ ${item.title} ${getModeBadgeHtml()}</span>
            <div class="dots-bar">${buildDots(redPenCases.length, "3_rp")}</div>
          </div>
          ${scaffoldHtml}
          <div class="case-card"><div class="cc-desc">${item.q}</div></div>
          <div class="paper-sheet">
            <div style="font-weight:900; color:var(--rose); margin-bottom:10px; font-size:calc(14px * var(--scale));">
              🖍️ 句子次序已隨機洗牌，請點擊藏有嚴重投資或強積金概念錯誤的那一句：
            </div>
            <div class="sentence-chips-wrap">${chipsHtml}</div>
          </div>
          <div class="feedback-box" id="rpFb"></div>
        </div>
        <div class="footer-bar">
          <button class="f-nav-btn" onclick="moveSub(-1, ${redPenCases.length})" ${idx === 0 ? 'style="visibility:hidden"' : ''}>← 上一題</button>
          <button class="f-nav-btn f-primary" onclick="${idx === redPenCases.length - 1 ? 'switchMod4Sub(1)' : `moveSub(1, ${redPenCases.length})`}">
            ${idx === redPenCases.length - 1 ? '進入「挑戰 B：選擇題消去法」 →' : '下一題 →'}
          </button>
        </div>
      `;
    } else {
      const item = elimMCs[idx];
      const stmtsHtml = item.stmts.map(st => {
        const curVal = elimState[st.id];
        return `
          <div class="elim-stmt-row">
            <div class="elim-stmt-text">
              ${st.text}
              ${isBasicMode ? `<span class="elim-stmt-hint">🤔 ${st.hint}</span>` : ''}
            </div>
            <div class="elim-toggles">
              <button class="elim-btn ${curVal === true ? 't-true' : ''}" onclick="toggleElim(${st.id}, true)">⭕ 正確</button>
              <button class="elim-btn ${curVal === false ? 't-false' : ''}" onclick="toggleElim(${st.id}, false)">❌ 錯誤</button>
            </div>
          </div>
        `;
      }).join("");

      const optsHtml = item.options.map((opt, oIdx) => {
        let isElim = false;
        [1, 2, 3].forEach(sId => {
          if (elimState[sId] === true && opt.reqFalse.includes(sId)) isElim = true;
          if (elimState[sId] === false && opt.reqTrue.includes(sId)) isElim = true;
        });
        return `<button class="mc-card-btn ${isElim ? 'eliminated' : ''}" onclick="checkElimMc(${oIdx})">${opt.label}</button>`;
      }).join("");

      stage.innerHTML = `
        <div>
          ${topSwitch}
          <div class="stage-header">
            <span class="sh-title">🏆 ${item.title} ${getModeBadgeHtml()}</span>
            <div class="dots-bar">${buildDots(elimMCs.length, "3_mc")}</div>
          </div>
          <div class="case-card"><div class="cc-desc">${item.stem}</div></div>
          <p style="font-size:calc(14px * var(--scale)); font-weight:800; color:var(--teal); margin-bottom:8px;">
            💡 消去法步驟：請先在右方逐句標記「⭕ 正確」或「❌ 錯誤」，下方矛盾的選項便會自動劃走！
          </p>
          <div>${stmtsHtml}</div>
          <div class="mc-options-row">${optsHtml}</div>
          <div class="feedback-box" id="elimFb"></div>
        </div>
        <div class="footer-bar">
          <button class="f-nav-btn" onclick="moveSub(-1, ${elimMCs.length})" ${idx === 0 ? 'style="visibility:hidden"' : ''}>← 上一題</button>
          <button class="f-nav-btn f-primary" onclick="moveSub(1, ${elimMCs.length})" ${idx === elimMCs.length - 1 ? 'style="visibility:hidden"' : ''}>下一題 →</button>
        </div>
      `;
    }
  }

  function checkRedPen(cIdx) {
    const idx = subIdx[3];
    const item = redPenCases[idx];
    const ch = item.chips[cIdx];
    const nums = ["①", "②", "③"];
    const el = document.getElementById(`rpChip_${cIdx}`);
    const fb = document.getElementById("rpFb");
    fb.style.display = "block";
    if (ch.isFlaw) {
      el.className = "sentence-chip flaw-found";
      addWealthScore(20, `3_rp_${idx}`);
      fb.className = "feedback-box fb-ok";
      fb.innerHTML = `<strong>🖍️ 紅筆精準捉錯（第 ${nums[cIdx]} 句得 0 分）！</strong><br>${item.exp}`;
    } else {
      el.className = "sentence-chip good-clicked";
      breakCombo();
      fb.className = "feedback-box fb-err";
      fb.innerHTML = `⭕ <strong>第 ${nums[cIdx]} 句是完全正確的陳述！</strong> 請再檢查其餘句子找出真正的投資或強積金概念陷阱！`;
    }
  }

  function toggleElim(sId, val) {
    elimState[sId] = (elimState[sId] === val) ? null : val;
    renderArenaZone(document.getElementById("mainStage"));
  }

  function checkElimMc(oIdx) {
    const idx = subIdx[3];
    const item = elimMCs[idx];
    const fb = document.getElementById("elimFb");
    fb.style.display = "block";
    if (oIdx === item.ansIdx) {
      addWealthScore(20, `3_mc_${idx}`);
      const breakdown = item.stmts.map(s => `• <strong>陳述 (${s.id}) ${s.isTrue ? '⭕ 正確' : '❌ 錯誤'}</strong>：${s.exp}`).join("<br>");
      fb.className = "feedback-box fb-ok";
      fb.innerHTML = `<strong>🏆 答對了！標準答案：${item.options[item.ansIdx].label}</strong><br>${breakdown}`;
    } else {
      breakCombo();
      fb.className = "feedback-box fb-err";
      fb.innerHTML = "❌ <strong>選項不正確！</strong> 試試先在上方逐句判斷 (1)、(2)、(3) 的對錯，利用消去法鎖定答案！";
    }
  }

  // 初始化啟動
  randomizeAll();
  renderSbContent();
  renderStage();
</script>
</body>
</html>
