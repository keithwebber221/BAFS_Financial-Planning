<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企會財證券交易看盤終端｜第 4 課：股票交易及投資</title>
  <style>
    :root {
      --bg-dark: #050811;
      --panel-dark: #0f172a;
      --card-bg: #ffffff;
      --soft-bg: #f8fafc;
      --up-green: #10b981;
      --up-bg: #d1fae5;
      --down-red: #f43f5e;
      --down-bg: #ffe4e6;
      --blue: #2563eb;
      --blue-light: #dbeafe;
      --amber: #d97706;
      --amber-light: #fef3c7;
      --text: #0f172a;
      --muted: #64748b;
      --scale: 1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "PingFang HK", "Microsoft JhengHei", "Noto Sans TC", sans-serif; user-select: none; }
    body {
      background: radial-gradient(circle at top, #1e293b, #050811 75%);
      color: var(--text);
      padding: 12px;
      font-size: calc(15.5px * var(--scale));
      line-height: 1.55;
      min-height: 100vh;
    }

    @keyframes fadeSlide { 0% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: translateY(0); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
    .fade-in { animation: fadeSlide 0.25s ease-out; }
    .shake { animation: shake 0.3s ease-in-out; }

    .app-wrap { max-width: 1140px; margin: 0 auto; }

    /* 頂部：港交所（HKEX）即時看盤報價機 Header */
    .ticker-header {
      background: linear-gradient(135deg, #090d16 0%, #1e293b 60%, #0f172a 100%);
      border-radius: 20px;
      padding: 16px 22px;
      color: #fff;
      margin-bottom: 14px;
      box-shadow: 0 14px 32px rgba(0,0,0,0.6);
      border: 1px solid rgba(56, 189, 248, 0.35);
    }
    .th-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.12); }
    .th-brand { display: flex; align-items: center; gap: 12px; }
    .hkex-logo {
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      color: #fff; padding: 8px 14px; border-radius: 12px; font-weight: 900;
      font-size: calc(13px * var(--scale)); letter-spacing: 0.5px; text-align: center; line-height: 1.2;
    }
    .th-title { font-size: calc(20px * var(--scale)); font-weight: 900; }
    .th-sub { font-size: calc(12.5px * var(--scale)); color: #94a3b8; font-weight: 700; }

    /* 雙軌難度切換器與頂部控制列 */
    .th-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .diff-switcher {
      display: inline-flex;
      background: rgba(5, 8, 17, 0.85);
      border: 2px solid rgba(251, 191, 36, 0.65);
      border-radius: 30px;
      padding: 3px;
      gap: 4px;
    }
    .diff-btn {
      border: none;
      padding: 5px 12px;
      border-radius: 24px;
      font-weight: 900;
      font-size: calc(12.5px * var(--scale));
      cursor: pointer;
      background: transparent;
      color: #cbd5e1;
      transition: all 0.2s;
    }
    .diff-btn.active-basic {
      background: #10b981;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.5);
    }
    .diff-btn.active-challenge {
      background: #f59e0b;
      color: #0f172a;
      box-shadow: 0 2px 8px rgba(245, 158, 11, 0.5);
    }

    .stat-pill { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); padding: 6px 12px; border-radius: 30px; font-weight: 900; font-size: calc(13px * var(--scale)); color: #38bdf8; }
    .ctrl-btn { background: #fbbf24; color: #0f172a; border: none; padding: 7px 13px; border-radius: 30px; font-weight: 900; font-size: calc(12.5px * var(--scale)); cursor: pointer; transition: transform 0.15s; }
    .ctrl-btn:hover { transform: scale(1.05); background: #fcd34d; }

    /* 即時模擬報價走馬燈列 */
    .live-ticker-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 12px; }
    @media (max-width: 780px) { .live-ticker-strip { grid-template-columns: repeat(2, 1fr); } }
    .ticker-box { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; }
    .tb-name { font-size: calc(12.5px * var(--scale)); font-weight: 800; color: #cbd5e1; }
    .tb-val { font-size: calc(14px * var(--scale)); font-weight: 900; }
    .val-up { color: #34d399; }
    .val-down { color: #fb7185; }

    /* 頂部常駐雙引擎沙盒：財經新聞股價因果模擬器 ＆ 恒指藍籌股篩選器 */
    .terminal-sandbox {
      background: linear-gradient(135deg, #0f172a, #1e1b4b);
      color: #fff;
      border-radius: 18px;
      padding: 16px 22px;
      margin-bottom: 14px;
      border: 2px solid #38bdf8;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    .ts-top { display: flex; justify-content: space-between; align-items: center; cursor: pointer; flex-wrap: wrap; gap: 10px; }
    .ts-title { font-size: calc(15.5px * var(--scale)); font-weight: 900; color: #7dd3fc; display: flex; align-items: center; gap: 8px; }
    .ts-toggle { background: rgba(56, 189, 248, 0.2); color: #bae6fd; border: 1px solid #38bdf8; padding: 4px 12px; border-radius: 20px; font-size: calc(12.5px * var(--scale)); font-weight: 900; cursor: pointer; }

    .ts-body { margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.15); }
    .ts-mode-bar { display: flex; gap: 8px; margin-bottom: 12px; }
    .tsm-btn { flex: 1; padding: 8px 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: #cbd5e1; font-weight: 900; font-size: calc(13.5px * var(--scale)); cursor: pointer; }
    .tsm-btn.active { background: #2563eb; color: #fff; border-color: #93c5fd; }

    .news-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    @media (max-width: 780px) { .news-grid { grid-template-columns: repeat(2, 1fr); } }
    .news-btn {
      padding: 9px 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.22);
      background: rgba(255,255,255,0.06); color: #f1f5f9; font-weight: 800; font-size: calc(13px * var(--scale));
      cursor: pointer; text-align: left; transition: all 0.15s;
    }
    .news-btn:hover { border-color: #fbbf24; }
    .news-btn.active { background: #fbbf24; color: #0f172a; border-color: #fde047; font-weight: 900; }

    .chain-display {
      background: rgba(9, 13, 22, 0.85); border: 1px solid #fbbf24; border-radius: 12px; padding: 14px 16px;
      font-size: calc(13.5px * var(--scale)); font-weight: 700; line-height: 1.55;
    }

    /* 四大實戰工作區導航 */
    .zone-nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
    @media (max-width: 780px) { .zone-nav { grid-template-columns: repeat(2, 1fr); } }
    .z-tab {
      background: #0f172a; border: 2px solid #1e293b; border-radius: 14px; padding: 12px 10px;
      color: #94a3b8; cursor: pointer; text-align: center; transition: all 0.2s;
    }
    .z-tab:hover { border-color: #38bdf8; color: #fff; transform: translateY(-2px); }
    .z-tab.active {
      background: linear-gradient(135deg, #2563eb, #0284c7);
      border-color: #7dd3fc; color: #fff; box-shadow: 0 6px 18px rgba(37, 99, 235, 0.45);
    }
    .zt-icon { font-size: calc(23px * var(--scale)); display: block; margin-bottom: 3px; }
    .zt-title { font-size: calc(14.5px * var(--scale)); font-weight: 900; display: block; }
    .zt-sub { font-size: calc(11.5px * var(--scale)); opacity: 0.9; }

    /* 主舞台 */
    .main-stage {
      background: var(--card-bg);
      border-radius: 22px;
      padding: 24px;
      min-height: 540px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 2px solid #cbd5e1;
    }

    .stage-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 2px solid #e2e8f0; }
    .sh-title { font-size: calc(18px * var(--scale)); font-weight: 900; color: #1e3a8a; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .mode-pill-indicator { font-size: calc(12px * var(--scale)); padding: 3px 10px; border-radius: 20px; font-weight: 900; }
    .mp-basic { background: #d1fae5; color: #065f46; border: 1px solid #10b981; }
    .mp-challenge { background: #fef3c7; color: #92400e; border: 1px solid #f59e0b; }

    .dots-bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .dot-btn {
      width: calc(34px * var(--scale)); height: calc(34px * var(--scale));
      border-radius: 10px; border: 2px solid #cbd5e1; background: #fff;
      font-weight: 900; font-size: calc(13.5px * var(--scale)); cursor: pointer; color: var(--muted);
    }
    .dot-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }
    .dot-btn.done { background: var(--up-bg); color: #065f46; border-color: var(--up-green); }

    /* 啟發式導學引導卡（只在基礎導學模式顯示） */
    .scaffold-banner {
      background: linear-gradient(135deg, #ecfdf5, #d1fae5);
      border: 2px solid #34d399;
      border-left: 7px solid var(--up-green);
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 14px;
      color: #064e3b;
      font-size: calc(14px * var(--scale));
      font-weight: 800;
      line-height: 1.55;
    }
    .scaffold-tag {
      display: inline-block;
      background: var(--up-green);
      color: #fff;
      font-size: calc(11.5px * var(--scale));
      font-weight: 900;
      padding: 2px 9px;
      border-radius: 20px;
      margin-right: 6px;
      margin-bottom: 3px;
    }

    /* 案例情境卡片與資料表 */
    .case-card {
      background: linear-gradient(135deg, #eff6ff, #dbeafe);
      border: 2px solid #93c5fd;
      border-left: 7px solid var(--blue);
      border-radius: 16px;
      padding: 16px 20px;
      margin-bottom: 16px;
    }
    .cc-tag { font-size: calc(12px * var(--scale)); font-weight: 900; color: #1d4ed8; margin-bottom: 4px; display: block; }
    .cc-desc { font-size: calc(15.5px * var(--scale)); font-weight: 900; color: #1e3a8a; line-height: 1.55; }

    .mini-table-wrap { overflow-x: auto; margin-bottom: 16px; }
    .info-table { width: 100%; border-collapse: collapse; font-size: calc(13.5px * var(--scale)); font-weight: 800; background: #fff; border-radius: 12px; overflow: hidden; border: 2px solid #cbd5e1; }
    .info-table th { background: #0f172a; color: #fff; padding: 8px 12px; text-align: left; }
    .info-table td { padding: 8px 12px; border-bottom: 1px solid #e2e8f0; color: #0f172a; }

    /* 三步對稱決策卡 */
    .steps-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
    @media (max-width: 820px) { .steps-grid { grid-template-columns: 1fr; } }
    .step-col {
      background: var(--soft-bg); border: 2px solid #cbd5e1; border-radius: 14px; padding: 14px;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .step-q { font-size: calc(13.5px * var(--scale)); font-weight: 900; color: #1e3a8a; margin-bottom: 10px; min-height: 42px; }
    .step-opts { display: flex; flex-direction: column; gap: 7px; }
    .step-btn {
      width: 100%; padding: 10px 12px; border-radius: 9px; border: 2px solid #cbd5e1;
      background: #fff; font-weight: 800; font-size: calc(13.5px * var(--scale)); color: var(--text);
      cursor: pointer; text-align: left; transition: all 0.15s; line-height: 1.45;
    }
    .step-btn:hover { border-color: var(--blue); background: #eff6ff; }
    .step-btn.picked { background: var(--blue-light); border-color: var(--blue); color: #1e3a8a; box-shadow: inset 0 0 0 1px var(--blue); }
    .step-btn.picked-ok { background: var(--up-bg); border-color: var(--up-green); color: #064e3b; }
    .step-btn.picked-err { background: var(--down-bg); border-color: var(--down-red); color: #881337; }

    /* 模組 4：紅筆捉錯 ＆ 選擇題消去雙擂台 */
    .sub-mode-bar { display: flex; gap: 8px; margin-bottom: 14px; }
    .sub-mode-btn { flex: 1; padding: 10px; border-radius: 10px; border: 2px solid #cbd5e1; background: #f8fafc; font-weight: 900; font-size: calc(14px * var(--scale)); cursor: pointer; color: var(--muted); }
    .sub-mode-btn.active { background: #1e3a8a; color: #fff; border-color: #1e3a8a; }
    .paper-sheet { background: #fefce8; border: 2px solid #fde047; border-radius: 16px; padding: 18px; margin-bottom: 14px; }
    .sentence-chips-wrap { display: flex; flex-direction: column; gap: 10px; }
    .sentence-chip { padding: 14px 16px; border-radius: 12px; border: 2px solid #cbd5e1; background: #fff; font-size: calc(15px * var(--scale)); font-weight: 800; color: var(--text); cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; line-height: 1.5; }
    .sentence-chip:hover { border-color: var(--down-red); background: #fff1f2; }
    .sentence-chip.flaw-found { border-color: var(--down-red); background: #ffe4e6; color: #9f1239; text-decoration: line-through; }
    .sentence-chip.good-clicked { border-color: var(--up-green); background: #dcfce7; color: #14532d; }

    .elim-stmt-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: #f8fafc; border: 2px solid #cbd5e1; border-radius: 12px; padding: 12px 16px; margin-bottom: 10px; flex-wrap: wrap; }
    .elim-stmt-text { font-size: calc(15px * var(--scale)); font-weight: 800; flex: 1; min-width: 240px; }
    .elim-stmt-hint { display: block; font-size: calc(12.5px * var(--scale)); color: #047857; font-weight: 800; margin-top: 4px; }
    .elim-toggles { display: flex; gap: 6px; }
    .elim-btn { padding: 6px 12px; border-radius: 8px; border: 2px solid #cbd5e1; background: #fff; font-weight: 900; font-size: calc(13.5px * var(--scale)); cursor: pointer; }
    .elim-btn.t-true { background: var(--up-green); color: #fff; border-color: var(--up-green); }
    .elim-btn.t-false { background: var(--down-red); color: #fff; border-color: var(--down-red); }
    .mc-options-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 14px; }
    @media (max-width: 600px) { .mc-options-row { grid-template-columns: 1fr; } }
    .mc-card-btn { padding: 14px 18px; border-radius: 12px; border: 2px solid #94a3b8; background: #fff; font-size: calc(16px * var(--scale)); font-weight: 900; text-align: left; cursor: pointer; transition: all 0.2s; }
    .mc-card-btn:hover { border-color: var(--blue); background: #eff6ff; }
    .mc-card-btn.eliminated { opacity: 0.28; text-decoration: line-through; background: #e2e8f0; border-color: #cbd5e1; }

    .helper-btn { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--blue); background: var(--blue-light); color: #1e3a8a; font-weight: 900; font-size: calc(12.5px * var(--scale)); cursor: pointer; }
    .helper-btn:hover { background: var(--blue); color: #fff; }

    .feedback-box { margin-top: 12px; padding: 16px 18px; border-radius: 14px; font-size: calc(14.5px * var(--scale)); font-weight: 700; display: none; line-height: 1.65; }
    .fb-ok { background: var(--up-bg); border: 2px solid var(--up-green); color: #064e3b; }
    .fb-err { background: var(--down-bg); border: 2px solid var(--down-red); color: #881337; }

    .footer-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; padding-top: 12px; border-top: 2px solid #e2e8f0; }
    .f-nav-btn { padding: 10px 20px; border-radius: 10px; border: 2px solid #cbd5e1; background: #fff; font-weight: 900; font-size: calc(14px * var(--scale)); cursor: pointer; color: #1e3a8a; }
    .f-nav-btn:hover { background: var(--blue-light); border-color: var(--blue); }
    .f-primary { background: linear-gradient(135deg, #2563eb, #0284c7); color: #fff; border: none; }
    .f-primary:hover { opacity: 0.92; }
  </style>
</head>
<body>

<div class="app-wrap">
  <!-- 頂部：港交所（HKEX）即時看盤報價機 Header（預設開啟「🔥 實戰挑戰」） -->
  <header class="ticker-header">
    <div class="th-top">
      <div class="th-brand">
        <div class="hkex-logo">HKEX 港交所<br>OTP-C 看盤終端</div>
        <div>
          <div class="th-title">基礎個人理財｜第 4 課：股票交易及投資</div>
          <div class="th-sub">影響股價的三層因素、香港交易所（主板與 GEM）＆ 恒生指數（HSI）分析</div>
        </div>
      </div>
      <div class="th-controls">
        <div class="diff-switcher" title="切換學習模式：預設為實戰挑戰；如需思維引導與分步回饋可切換至基礎導學">
          <button class="diff-btn" id="btnBasicMode" onclick="setDifficulty(true)">🌱 基礎導學</button>
          <button class="diff-btn active-challenge" id="btnChallengeMode" onclick="setDifficulty(false)">🔥 實戰挑戰</button>
        </div>
        <div class="stat-pill" id="scoreBadge">📈 積分：0</div>
        <div class="stat-pill" id="comboBadge" style="color:#fde047; border-color:rgba(251,191,36,0.45);">🔥 連擊：0</div>
        <button class="ctrl-btn" onclick="reshuffleAll()">🔀 洗牌</button>
        <button class="ctrl-btn" onclick="toggleZoom()" id="zoomBtn">🔍 大字體：關</button>
      </div>
    </div>

    <div class="live-ticker-strip" id="liveTickerStrip">
      <div class="ticker-box"><span class="tb-name">恒生指數 (HSI)</span><span class="tb-val val-up">▲ 21,450.8 (+1.85%)</span></div>
      <div class="ticker-box"><span class="tb-name">金融分類指數</span><span class="tb-val val-up">▲ 34,120.5 (+2.10%)</span></div>
      <div class="ticker-box"><span class="tb-name">公用事業分類指數</span><span class="tb-val val-up">▲ 46,890.0 (+0.55%)</span></div>
      <div class="ticker-box"><span class="tb-name">地產 ／ 工商業分類</span><span class="tb-val val-down">▼ 29,340.2 (-0.40%)</span></div>
    </div>
  </header>

  <!-- 頂部常駐雙引擎沙盒：財經新聞股價因果模擬器 ＆ 主板/GEM/恒指藍籌股篩選器 -->
  <section class="terminal-sandbox">
    <div class="ts-top" onclick="toggleSandbox()">
      <div class="ts-title">🎛️ 互動「突發財經新聞股價因果鏈模擬器 ＆ 主板／GEM／藍籌股資格審核器」（點擊展開／收起）</div>
      <button class="ts-toggle" id="tsToggleBtn">收起模擬器 ▲</button>
    </div>
    <div class="ts-body" id="tsBody">
      <div class="ts-mode-bar">
        <button class="tsm-btn active" id="tsm0" onclick="switchTsTool(0)">📰 工具一：突發財經新聞對股價的影響因果鏈</button>
        <button class="tsm-btn" id="tsm1" onclick="switchTsTool(1)">🏛️ 工具二：主板 vs GEM 對比 ＆ 恒指成份股（藍籌股）資格審核</button>
      </div>
      <div id="tsInteractiveArea"></div>
    </div>
  </section>

  <!-- 四大實戰工作區導航 -->
  <nav class="zone-nav">
    <button class="z-tab active" onclick="switchZone(0)" id="zTab0">
      <span class="zt-icon">📰</span>
      <span class="zt-title">影響股價三層因素</span>
      <span class="zt-sub">宏觀經濟、行業、企業與投機</span>
    </button>
    <button class="z-tab" onclick="switchZone(1)" id="zTab1">
      <span class="zt-icon">🏛️</span>
      <span class="zt-title">港交所：主板與 GEM</span>
      <span class="zt-sub">證券種類、市值計算與平台比較</span>
    </button>
    <button class="z-tab" onclick="switchZone(2)" id="zTab2">
      <span class="zt-icon">📊</span>
      <span class="zt-title">恒生指數 (HSI) 分析</span>
      <span class="zt-sub">藍籌股資格、分類指數與重要性</span>
    </button>
    <button class="z-tab" onclick="switchZone(3)" id="zTab3">
      <span class="zt-icon">🏆</span>
      <span class="zt-title">捉錯與消去雙擂台</span>

  function prepareDynamicMC(mcItem) {

      hint: s.hint,
      isTrue: s.isTrue,
      exp: s.exp
    }));
    const trueIds = mcItem.stmts.filter(s => s.isTrue).map(s => s.id);
    const correctCombo = allComboDefs.find(c =>
      c.reqTrue.length === trueIds.length && c.reqTrue.every(id => trueIds.includes(id))
    );
    const wrongPool = shuffle(allComboDefs.filter(c => c !== correctCombo)).slice(0, 3);
    const chosenCombos = [correctCombo, ...wrongPool].sort((a, b) => a.order - b.order);
    const letters = ["A", "B", "C", "D"];
    mcItem.options = chosenCombos.map((c, idx) => ({
      label: `${letters[idx]}. ${c.text}`,
      reqTrue: c.reqTrue,
      reqFalse: c.reqFalse
    }));
    mcItem.ansIdx = chosenCombos.indexOf(correctCombo);
  }

    renderArenaZone(document.getElementById("mainStage"));
  }

  function renderArenaZone(stage) {
    const idx = subIdx[3];
    const topSwitch = `
      <div class="sub-mode-bar">
        <button class="sub-mode-btn ${mod4Sub === 0 ? 'active' : ''}" onclick="switchMod4Sub(0)">🖍️ 挑戰 A：紅筆捉錯（點擊答卷錯句）</button>
        <button class="sub-mode-btn ${mod4Sub === 1 ? 'active' : ''}" onclick="switchMod4Sub(1)">🏆 挑戰 B：組合選擇題消去法神器</button>
      </div>
    `;

    if (mod4Sub === 0) {
      const item = redPenCases[idx];
      const nums = ["①", "②", "③"];

      const scaffoldHtml = isBasicMode ? `
        <div class="scaffold-banner">
          <span class="scaffold-tag">🌱 導學審題切入點</span>
          ${item.guideHint}（已為你精簡句子字數，方便檢視邏輯）
        </div>
      ` : '';

      const chipsHtml = item.chips.map((ch, cIdx) => {
        const displayTxt = isBasicMode ? ch.easyText : ch.text;
        return `
          <div class="sentence-chip" id="rpChip_${cIdx}" onclick="checkRedPen(${cIdx})">
            <span>${nums[cIdx]} ${displayTxt}</span>
            <span style="font-size:calc(13px * var(--scale)); color:var(--down-red); font-weight:900; white-space:nowrap;">🖍️ 點此捉錯</span>
          </div>
        `;
      }).join("");

      stage.innerHTML = `
        <div>
          ${topSwitch}
          <div class="stage-header">
            <span class="sh-title">🖍️ ${item.title} ${getModeBadgeHtml()}</span>
            <div class="dots-bar">${buildDots(redPenCases.length, "3_rp")}</div>
          </div>
          ${scaffoldHtml}
          <div class="case-card"><div class="cc-desc">${item.q}</div></div>
          <div class="paper-sheet">
            <div style="font-weight:900; color:var(--down-red); margin-bottom:10px; font-size:calc(14px * var(--scale));">
              🖍️ 句子次序已隨機洗牌，請點擊藏有嚴重股票市場或恒生指數概念錯誤的那一句：
            </div>
            <div class="sentence-chips-wrap">${chipsHtml}</div>
          </div>
          <div class="feedback-box" id="rpFb"></div>
        </div>
        <div class="footer-bar">
          <button class="f-nav-btn" onclick="moveSub(-1, ${redPenCases.length})" ${idx === 0 ? 'style="visibility:hidden"' : ''}>← 上一題</button>
          <button class="f-nav-btn f-primary" onclick="${idx === redPenCases.length - 1 ? 'switchMod4Sub(1)' : `moveSub(1, ${redPenCases.length})`}">
            ${idx === redPenCases.length - 1 ? '進入「挑戰 B：選擇題消去法」 →' : '下一題 →'}
          </button>
        </div>
      `;
    } else {
      const item = elimMCs[idx];
      const stmtsHtml = item.stmts.map(st => {
        const curVal = elimState[st.id];
        return `
          <div class="elim-stmt-row">
            <div class="elim-stmt-text">
              ${st.text}
              ${isBasicMode ? `<span class="elim-stmt-hint">🤔 ${st.hint}</span>` : ''}
            </div>
            <div class="elim-toggles">
              <button class="elim-btn ${curVal === true ? 't-true' : ''}" onclick="toggleElim(${st.id}, true)">⭕ 正確</button>
              <button class="elim-btn ${curVal === false ? 't-false' : ''}" onclick="toggleElim(${st.id}, false)">❌ 錯誤</button>
            </div>
          </div>
        `;
      }).join("");

      const optsHtml = item.options.map((opt, oIdx) => {
        let isElim = false;
        [1, 2, 3].forEach(sId => {
          if (elimState[sId] === true && opt.reqFalse.includes(sId)) isElim = true;
          if (elimState[sId] === false && opt.reqTrue.includes(sId)) isElim = true;
        });
        return `<button class="mc-card-btn ${isElim ? 'eliminated' : ''}" onclick="checkElimMc(${oIdx})">${opt.label}</button>`;
      }).join("");

      stage.innerHTML = `
        <div>
          ${topSwitch}
          <div class="stage-header">
            <span class="sh-title">🏆 ${item.title} ${getModeBadgeHtml()}</span>
            <div class="dots-bar">${buildDots(elimMCs.length, "3_mc")}</div>
          </div>
          <div class="case-card"><div class="cc-desc">${item.stem}</div></div>
          <p style="font-size:calc(14px * var(--scale)); font-weight:800; color:var(--blue); margin-bottom:8px;">
            💡 消去法步驟：請先在右方逐句標記「⭕ 正確」或「❌ 錯誤」，下方矛盾的選項便會自動劃走！
          </p>
          <div>${stmtsHtml}</div>
          <div class="mc-options-row">${optsHtml}</div>
          <div class="feedback-box" id="elimFb"></div>
        </div>
        <div class="footer-bar">
          <button class="f-nav-btn" onclick="moveSub(-1, ${elimMCs.length})" ${idx === 0 ? 'style="visibility:hidden"' : ''}>← 上一題</button>
          <button class="f-nav-btn f-primary" onclick="moveSub(1, ${elimMCs.length})" ${idx === elimMCs.length - 1 ? 'style="visibility:hidden"' : ''}>下一題 →</button>
        </div>
      `;
    }
  }

  function checkRedPen(cIdx) {
    const idx = subIdx[3];
    const item = redPenCases[idx];
    const ch = item.chips[cIdx];
    const nums = ["①", "②", "③"];
    const el = document.getElementById(`rpChip_${cIdx}`);
    const fb = document.getElementById("rpFb");
    fb.style.display = "block";
    if (ch.isFlaw) {
      el.className = "sentence-chip flaw-found";
      addStockScore(20, `3_rp_${idx}`);
      fb.className = "feedback-box fb-ok";
      fb.innerHTML = `<strong>🖍️ 紅筆精準捉錯（第 ${nums[cIdx]} 句得 0 分）！</strong><br>${item.exp}`;
    } else {
      el.className = "sentence-chip good-clicked";
      breakCombo();
      fb.className = "feedback-box fb-err";
      fb.innerHTML = `⭕ <strong>第 ${nums[cIdx]} 句是完全正確的陳述！</strong> 請再檢查其餘句子找出真正的股票或恒指概念陷阱！`;
    }
  }

  function toggleElim(sId, val) {
    elimState[sId] = (elimState[sId] === val) ? null : val;
    renderArenaZone(document.getElementById("mainStage"));
  }

  function checkElimMc(oIdx) {
    const idx = subIdx[3];
    const item = elimMCs[idx];
    const fb = document.getElementById("elimFb");
    fb.style.display = "block";
    if (oIdx === item.ansIdx) {
      addStockScore(20, `3_mc_${idx}`);
      const breakdown = item.stmts.map(s => `• <strong>陳述 (${s.id}) ${s.isTrue ? '⭕ 正確' : '❌ 錯誤'}</strong>：${s.exp}`).join("<br>");
      fb.className = "feedback-box fb-ok";
      fb.innerHTML = `<strong>🏆 答對了！標準答案：${item.options[item.ansIdx].label}</strong><br>${breakdown}`;
    } else {
      breakCombo();
      fb.className = "feedback-box fb-err";
      fb.innerHTML = "❌ <strong>選項不正確！</strong> 試試先在上方逐句判斷 (1)、(2)、(3) 的對錯，利用消去法鎖定答案！";
    }
  }

  // 初始化啟動
  randomizeAll();
  renderTsArea();
  renderStage();
</script>
</body>
</html>
